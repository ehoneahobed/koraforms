name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Install Playwright Chromium
        run: |
          # Avoid `install --with-deps` apt path: GitHub runners currently hit a
          # persistent Hash Sum mismatch on dl.google.com/linux/chrome-stable.
          pnpm exec playwright install chromium
      - run: pnpm run test:e2e
        env:
          # Prefer Playwright's bundled Chromium over any system Chrome.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'

  deploy:
    name: Deploy to Azure Container Apps
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RG || 'koraforms-rg' }}
          containerAppName: ${{ vars.AZURE_APP || 'koraforms' }}
          containerAppEnvironment: ${{ vars.AZURE_ENV || 'koraforms-env' }}
          targetPort: 3001
          ingress: external
          appSourcePath: ${{ github.workspace }}
          environmentVariables: >-
            KORA_AUTH_SECRET=secretref:kora-auth-secret
            KORA_METRICS_TOKEN=secretref:kora-metrics-token
            DATABASE_URL=secretref:database-url
            NODE_ENV=production
            PUBLIC_URL=${{ vars.PUBLIC_URL || 'https://forms.korajs.dev' }}

      - name: Health check
        run: |
          set -euo pipefail
          APP="${{ vars.AZURE_APP || 'koraforms' }}"
          RG="${{ vars.AZURE_RG || 'koraforms-rg' }}"
          FQDN=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          # Single-revision mode always points traffic at "latest". A bare
          # /health curl can still succeed against a leftover healthy replica
          # while the new revision is crash-looping — verify latest explicitly.
          for _ in $(seq 1 30); do
            NAME=$(az containerapp revision list -n "$APP" -g "$RG" \
              --query "reverse(sort_by([].{name:name,created:properties.createdTime}, &created))[0].name" -o tsv)
            STATE=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$NAME" \
              --query "{running:properties.runningState,health:properties.healthState,replicas:properties.replicas}" -o json)
            echo "latest=$NAME $STATE"
            RUNNING=$(echo "$STATE" | python3 -c "import json,sys; print(json.load(sys.stdin)['running'])")
            HEALTH=$(echo "$STATE" | python3 -c "import json,sys; print(json.load(sys.stdin)['health'])")
            REPLICAS=$(echo "$STATE" | python3 -c "import json,sys; print(json.load(sys.stdin)['replicas'])")
            if [ "$RUNNING" = "Running" ] && [ "$HEALTH" = "Healthy" ] && [ "$REPLICAS" -ge 1 ]; then
              curl -fsS "https://${FQDN}/health"
              echo
              exit 0
            fi
            if [ "$RUNNING" = "ActivationFailed" ] || [ "$RUNNING" = "Failed" ]; then
              echo "Latest revision failed to activate: $NAME ($RUNNING)"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for a healthy latest revision"
          exit 1
