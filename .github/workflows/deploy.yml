name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:e2e

  deploy:
    name: Deploy to Azure Container Apps
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ vars.AZURE_RG || 'koraforms-rg' }}
          containerAppName: ${{ vars.AZURE_APP || 'koraforms' }}
          containerAppEnvironment: ${{ vars.AZURE_ENV || 'koraforms-env' }}
          targetPort: 3001
          ingress: external
          appSourcePath: ${{ github.workspace }}
          environmentVariables: >-
            KORA_AUTH_SECRET=secretref:kora-auth-secret
            KORA_METRICS_TOKEN=secretref:kora-metrics-token
            DATABASE_URL=secretref:database-url
            NODE_ENV=production
            PUBLIC_URL=${{ vars.PUBLIC_URL }}

      - name: Health check
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_APP || 'koraforms' }}" \
            --resource-group "${{ vars.AZURE_RG || 'koraforms-rg' }}" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          curl -fsS "https://${FQDN}/health"
