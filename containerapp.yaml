# Azure Container Apps configuration
# Apply with: az containerapp update --name koraforms --resource-group koraforms-rg --yaml containerapp.yaml
#
# This file configures:
#   - Production PostgreSQL persistence
#   - Runtime secrets
#   - HTTP ingress for app traffic and WebSocket sync
#   - Single-replica launch posture until framework-level conditional admission
#   - WebSocket transport support
#
# Portable: when migrating to AWS/GCP, this file is replaced by their
# equivalent (ECS task definition, Cloud Run YAML) — the Dockerfile stays the same.
#
# Do not use Azure Files for SQLite. SMB locking semantics are unsafe for
# SQLite, and ephemeral container storage loses production data on replacement.

properties:
  configuration:
    ingress:
      external: true
      targetPort: 3001
      transport: http
      # WebSocket connections require session affinity
      stickySessions:
        affinity: sticky
    secrets:
      - name: kora-auth-secret
        value: "" # Set via: az containerapp secret set --name koraforms --resource-group koraforms-rg --secrets kora-auth-secret=<value>
      - name: kora-metrics-token
        value: "" # Set via: az containerapp secret set --name koraforms --resource-group koraforms-rg --secrets kora-metrics-token=<value>
      - name: database-url
        value: "" # Set via: az containerapp secret set --name koraforms --resource-group koraforms-rg --secrets database-url=<postgres-url>
      - name: resend-api-key
        value: "" # Set via: az containerapp secret set --name koraforms --resource-group koraforms-rg --secrets resend-api-key=<value>
  template:
    containers:
      - name: koraforms
        image: "" # Set by CI/CD pipeline
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: KORA_AUTH_SECRET
            secretRef: kora-auth-secret
          - name: KORA_METRICS_TOKEN
            secretRef: kora-metrics-token
          - name: DATABASE_URL
            secretRef: database-url
          - name: NODE_ENV
            value: production
          - name: PORT
            value: "3001"
          # One proxy (the Container Apps ingress) sits in front of the app;
          # trust its X-Forwarded-For hop for client IPs (sign-in rate limits).
          - name: KORA_TRUST_PROXY
            value: "1"
          - name: PUBLIC_URL
            value: "" # Set to https://your-production-domain
          - name: RESEND_API_KEY
            secretRef: resend-api-key
          - name: EMAIL_FROM
            value: "KoraForms <info@korajs.dev>"
          # Uploaded files outlive the container only on the mounted share below.
          - name: BLOB_STORE_PATH
            value: /data/blobs
        volumeMounts:
          - volumeName: blob-data
            mountPath: /data/blobs
    volumes:
      - name: blob-data
        storageType: AzureFile
        storageName: koraforms-blob-storage
    scale:
      minReplicas: 1
      # Keep public launch single-replica until Kora exposes conditional
      # admission/transactions for hard response quotas across instances.
      maxReplicas: 1
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "50"
